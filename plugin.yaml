# 本文件由 backend/cmd/genmanifest 自动生成，请勿手工修改。

id: gateway-openai
name: OpenAI 网关
version: dev
description: OpenAI Responses API / Chat Completions 转发
author: airgate
type: gateway
min_core_version: 1.0.0
dependencies: []
config:
  - key: codex_fingerprint_mode
    label: Codex 三标识收敛模式
    type: select
    default: "off"
    description: off：不收敛；device：只收敛 installation_id；session：收敛 installation_id/session_id，并按客户端会话派生 thread_id；full：三个标识全部收敛。
    required: false
    options:
      - value: "off"
        label: 关闭（不修改）
      - value: device
        label: 设备（installation_id）
      - value: session
        label: 会话（installation + session）
      - value: full
        label: 完整（三标识全部收敛）
frontend_widgets:
  - slot: account-identity
    entry_file: index.js
    title: OpenAI 账号身份
  - slot: account-create
    entry_file: index.js
    title: 创建 OpenAI 账号
  - slot: account-edit
    entry_file: index.js
    title: 编辑 OpenAI 账号
  - slot: account-usage-window
    entry_file: index.js
    title: 账号用量窗口
  - slot: usage-metric-detail
    entry_file: index.js
    title: OpenAI 计量明细
  - slot: usage-cost-detail
    entry_file: index.js
    title: OpenAI 费用明细
gateway:
  platform: openai
  mode: simple
  routes:
    - method: POST
      path: /v1/responses
      description: Responses API（Codex 核心端点）
    - method: POST
      path: /v1/responses/compact
      description: Responses Compact API（上下文压缩）
    - method: POST
      path: /v1/chat/completions
      description: Chat Completions API
    - method: POST
      path: /v1/messages
      description: Anthropic Messages API（协议翻译）
    - method: POST
      path: /v1/messages/count_tokens
      description: Anthropic Count Tokens（兼容回退）
    - method: GET
      path: /v1/models
      description: 模型列表
    - method: POST
      path: /v1/images/generations
      description: Images API（文生图）
    - method: POST
      path: /v1/images/edits
      description: Images API（图生图 / 编辑）
    - method: GET
      path: /v1/images/tasks
      description: Images Task 状态查询
    - method: GET
      path: /v1/images/tasks/list
      description: Images Task 历史列表
    - method: WS
      path: /v1/responses
      description: Responses API（WebSocket）
    - method: POST
      path: /responses
      description: Responses API（无 /v1 前缀）
    - method: POST
      path: /responses/compact
      description: Responses Compact API（无 /v1 前缀）
    - method: POST
      path: /chat/completions
      description: Chat Completions API（无 /v1 前缀）
    - method: POST
      path: /messages
      description: Anthropic Messages API（无 /v1 前缀）
    - method: POST
      path: /messages/count_tokens
      description: Anthropic Count Tokens（无 /v1 前缀）
    - method: GET
      path: /models
      description: 模型列表（无 /v1 前缀）
    - method: POST
      path: /images/generations
      description: Images API（文生图，无 /v1 前缀）
    - method: POST
      path: /images/edits
      description: Images API（图生图，无 /v1 前缀）
    - method: GET
      path: /images/tasks
      description: Images Task 状态查询（无 /v1 前缀）
    - method: GET
